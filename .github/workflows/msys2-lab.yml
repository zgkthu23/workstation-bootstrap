name: MSYS2 Internals Lab

on:
  workflow_dispatch:
  push:

jobs:
  lab:
    runs-on: windows-2025

    steps:
      - name: Windows baseline
        shell: pwsh
        run: |
          Write-Host "=== Native Windows ==="
          whoami
          $PSVersionTable
          Get-ComputerInfo |
            Select-Object WindowsProductName, OsArchitecture

          Write-Host "`n=== MSYS2 already on runner? ==="
          Test-Path C:\msys64
      - name: Setup MSYS2
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            file
            procps-ng
            mingw-w64-ucrt-x86_64-gcc
      - name: Enter MSYS2
        shell: msys2 {0}
        run: |
          echo "MSYSTEM=$MSYSTEM"

          uname -a

          echo
          echo "bash:"
          which bash

      - name: Build native Windows program
        shell: msys2 {0}
        run: |
          cat > hello.c <<'EOF'
          #include <stdio.h>

          int main(void) {
              printf("Hello from native Windows!\n");
              return 0;
          }
          EOF

          gcc hello.c -o hello.exe

          echo "=== resulting binary ==="
          file hello.exe

          echo
          echo "=== imported DLLs ==="
          objdump -p hello.exe |
            grep 'DLL Name'
      - name: Run without MSYS2 shell
        shell: pwsh
        run: |
          Write-Host "Now I am back in native PowerShell"

          & "$env:GITHUB_WORKSPACE\hello.exe"

