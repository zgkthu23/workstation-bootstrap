name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install yamllint
        run: pip install yamllint
      - name: Lint YAML files
        run: yamllint inventory/ manifests/ projects/ .github/ MANIFEST.yaml
      - name: Validate manifests
        run: python3 tests/validate_manifests.py
      - name: Secret scan
        run: python3 tests/test_no_secrets.py
      - name: Unix contract smoke test
        run: |
          bash run.sh --list-tasks --output-format json
          bash run.sh --task create-directories --dry-run --output-format json

  shellcheck:
    name: Shell script checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: shellcheck run.sh scripts/unix/*.sh scripts/lib/common.bash

  powershell:
    name: PowerShell syntax check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $files = @((Get-Item run.ps1))
          $files += Get-ChildItem -Path scripts/windows -Filter *.ps1
          $files += Get-ChildItem -Path scripts/lib -Filter *.psm1
          $files | ForEach-Object {
            Write-Host "Checking: $($_.Name)"
            $errors = $null
            $ast = [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errors
            )
            if ($errors.Count -gt 0) {
              Write-Host "  FAIL: $($errors.Count) error(s)"
              $errors | ForEach-Object { Write-Host "    $($_.Message)" }
              exit 1
            }
            Write-Host "  PASS"
          }
      - name: PowerShell contract smoke test
        shell: pwsh
        run: |
          .\run.ps1 -ListTasks -OutputFormat json
          .\run.ps1 -Task create-directories -DryRun -OutputFormat json
