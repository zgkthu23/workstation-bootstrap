name: Build Windows app
on:
  workflow_dispatch:

jobs:
  explore-windows:
    runs-on: windows-latest
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Check uv
        run: |
          uv python list
          uv cache dir

