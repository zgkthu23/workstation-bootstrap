schema_version: 2
id: workstation-bootstrap
description: Simple declarative workstation setup

files:
  hosts: hosts/*.yaml
  tools: catalog/tools.yaml
  repositories: catalog/repositories.yaml

rules:
  show_plan_before_changes: true
  install_only_if_missing: true
  clone_only_if_missing: true
  package_channel: provider-stable
  secrets_in_repository: forbidden
  templates_are_reference_only: true

secrets:
  backend: macos-keychain
  shell_export_on_personal_hosts: allowed
