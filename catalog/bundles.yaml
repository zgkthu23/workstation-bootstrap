schema_version: 2
id: tool-bundles

bundles:
  - id: base-cli
    description: Portable command-line essentials
    required_tools: [git, github-cli, neovim]
    optional_tools: [curl, wget, tmux, htop, ripgrep, fd, jq, archive-tools]

  - id: desktop-development
    description: Graphical editors and platform terminal applications
    required_tools: [visual-studio-code]
    optional_tools: [windows-terminal, powershell, iterm2, tabby, naps2]

  - id: c-development
    description: C and C++ compilers, build systems, debuggers, and analysis tools
    required_tools: [c-toolchain, llvm, cmake, ninja, gdb]
    optional_tools: [lldb, valgrind]

  - id: python-development
    description: Python 3.12 development environment
    required_tools: [python, uv]
    optional_tools: [python-dev, python-pip, python-venv]

  - id: node-development
    description: Node.js LTS development environment
    required_tools: [node, pnpm]
    optional_tools: [npm]

  - id: ai-tools
    description: Coding agents and provider management
    required_tools: [claude-code, codex, cc-switch]
    optional_tools: []

  - id: containers
    description: Local container runtime and Compose
    required_tools: [docker]
    optional_tools: [docker-compose]

  - id: office
    description: Office and PDF applications
    required_tools: [libreoffice]
    optional_tools: [microsoft-office, adobe-reader]

  - id: research-cli
    description: Typesetting and research command-line tools
    required_tools: [latex, pandoc]
    optional_tools: [r, julia]

  - id: research-desktop
    description: Reference management and diagramming
    required_tools: [zotero]
    optional_tools: [drawio]

  - id: shell
    description: Interactive zsh enhancements
    required_tools: [zsh-autosuggestions, zsh-syntax-highlighting]
    optional_tools: []

  - id: network-client
    description: GFW-capable local proxy client
    required_tools: [v2rayn]
    optional_tools: []

  - id: desktop-extras
    description: Optional media, graphics, communication, and productivity applications
    required_tools: []
    optional_tools: [vlc, gimp, inkscape, thunderbird, spotify, notion, discord, steam, slack]
