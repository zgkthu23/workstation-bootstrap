schema_version: 2

# Omitted platform mappings are unsupported and are simply skipped.
tools:
  git:
    macos: {provider: brew-formula, package: git}
    ubuntu: {provider: apt, package: git}
    windows: {provider: winget, package: Git.Git}

  github-cli:
    macos: {provider: brew-formula, package: gh}
    ubuntu: {provider: apt, package: gh}
    windows: {provider: winget, package: GitHub.cli}

  neovim:
    macos: {provider: brew-formula, package: neovim}
    ubuntu: {provider: apt, package: neovim}
    windows: {provider: winget, package: Neovim.Neovim}

  bat:
    macos: {provider: brew-formula, package: bat}
    ubuntu: {provider: apt, package: bat}

  chezmoi:
    macos: {provider: brew-formula, package: chezmoi}
    ubuntu: {provider: apt, package: chezmoi}
    windows: {provider: winget, package: twpayne.chezmoi}

  curl:
    macos: {provider: brew-formula, package: curl}
    ubuntu: {provider: apt, package: curl}

  wget:
    macos: {provider: brew-formula, package: wget}
    ubuntu: {provider: apt, package: wget}

  tmux:
    macos: {provider: brew-formula, package: tmux}
    ubuntu: {provider: apt, package: tmux}

  htop:
    macos: {provider: brew-formula, package: htop}
    ubuntu: {provider: apt, package: htop}

  ripgrep:
    macos: {provider: brew-formula, package: ripgrep}
    ubuntu: {provider: apt, package: ripgrep}

  fd:
    macos: {provider: brew-formula, package: fd}
    ubuntu: {provider: apt, package: fd-find}

  jq:
    macos: {provider: brew-formula, package: jq}
    ubuntu: {provider: apt, package: jq}

  visual-studio-code:
    macos: {provider: brew-cask, package: visual-studio-code}
    ubuntu: {provider: apt, package: code}
    windows: {provider: winget, package: Microsoft.VisualStudioCode}

  c-toolchain:
    macos: {provider: brew-formula, package: llvm}
    ubuntu: {provider: apt, package: build-essential}
    windows: {provider: winget, package: Microsoft.VisualStudio.2022.Community}

  cmake:
    macos: {provider: brew-formula, package: cmake}
    ubuntu: {provider: apt, package: cmake}
    windows: {provider: winget, package: CMake.CMake}

  ninja:
    macos: {provider: brew-formula, package: ninja}
    ubuntu: {provider: apt, package: ninja-build}
    windows: {provider: winget, package: Ninja-build.Ninja}

  gdb:
    macos: {provider: brew-formula, package: gdb}
    ubuntu: {provider: apt, package: gdb}

  python:
    macos: {provider: brew-formula, package: python}
    ubuntu: {provider: apt, package: python3}
    windows: {provider: winget, package: Python.Python.3}

  uv:
    macos: {provider: brew-formula, package: uv}
    ubuntu:
      provider: official-installer
      source: https://astral.sh/uv/install.sh
      documentation: https://docs.astral.sh/uv/getting-started/installation/
    windows: {provider: winget, package: astral-sh.uv}

  node:
    macos: {provider: brew-formula, package: node}
    ubuntu: {provider: apt, package: nodejs}
    windows: {provider: winget, package: OpenJS.NodeJS.LTS}

  pnpm:
    macos: {provider: brew-formula, package: pnpm}
    ubuntu: {provider: npm-global, package: pnpm}
    windows: {provider: winget, package: pnpm.pnpm}

  claude-code:
    macos:
      provider: official-installer
      source: https://claude.ai/install.sh
      documentation: https://code.claude.com/docs/en/setup
    ubuntu:
      provider: official-installer
      source: https://claude.ai/install.sh
      documentation: https://code.claude.com/docs/en/setup
    windows:
      provider: official-installer
      source: https://claude.ai/install.ps1
      documentation: https://code.claude.com/docs/en/setup

  codex:
    macos:
      provider: official-installer
      source: https://chatgpt.com/codex/install.sh
      documentation: https://learn.chatgpt.com/docs/codex/cli
    ubuntu:
      provider: official-installer
      source: https://chatgpt.com/codex/install.sh
      documentation: https://learn.chatgpt.com/docs/codex/cli
    windows:
      provider: official-installer
      source: https://chatgpt.com/codex/install.ps1
      documentation: https://learn.chatgpt.com/docs/codex/cli

  cc-switch:
    macos:
      provider: brew-cask
      package: cc-switch
      tap: farion1231/ccswitch
    ubuntu: {provider: manual, source: https://github.com/farion1231/cc-switch/releases/latest}
    windows: {provider: manual, source: https://github.com/farion1231/cc-switch/releases/latest}

  libreoffice:
    macos: {provider: brew-cask, package: libreoffice}
    ubuntu: {provider: apt, package: libreoffice}
    windows: {provider: winget, package: TheDocumentFoundation.LibreOffice}

  obsidian:
    macos: {provider: brew-cask, package: obsidian}
    ubuntu: {provider: manual, source: https://obsidian.md/download}
    windows: {provider: winget, package: Obsidian.Obsidian}

  pandoc:
    macos: {provider: brew-formula, package: pandoc}
    ubuntu: {provider: apt, package: pandoc}

  r:
    macos: {provider: brew-formula, package: r}
    ubuntu: {provider: apt, package: r-base}

  julia:
    macos: {provider: brew-formula, package: julia}
    ubuntu: {provider: apt, package: julia}

  zsh-autosuggestions:
    macos: {provider: brew-formula, package: zsh-autosuggestions}
    ubuntu: {provider: apt, package: zsh-autosuggestions}

  zsh-syntax-highlighting:
    macos: {provider: brew-formula, package: zsh-syntax-highlighting}
    ubuntu: {provider: apt, package: zsh-syntax-highlighting}

  v2rayn:
    macos: {provider: manual, source: https://github.com/2dust/v2rayN/releases/latest}
    ubuntu: {provider: manual, source: https://github.com/2dust/v2rayN/releases/latest}
    windows: {provider: winget, package: 2dust.v2rayN}
