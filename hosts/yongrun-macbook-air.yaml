schema_version: 2
id: yongrun-macbook-air
description: Yongrun's personal MacBook Air

hostnames: [Guangkuos-MacBook-Air.local]
platform: macos
arch: arm64

paths:
  workspace: ~/workspace
  data: ~/data
  scratch: ~/scratch
  repositories: ~/workspace/repos
  cloud: ~/Library/CloudStorage

tools:
  - git
  - github-cli
  - neovim
  - bat
  - chezmoi
  - curl
  - wget
  - tmux
  - htop
  - ripgrep
  - fd
  - jq
  - visual-studio-code
  - c-toolchain
  - cmake
  - ninja
  - gdb
  - python
  - uv
  - node
  - pnpm
  - claude-code
  - codex
  - cc-switch
  - libreoffice
  - obsidian
  - pandoc
  - r
  - julia
  - zsh-autosuggestions
  - zsh-syntax-highlighting
  - v2rayn

repositories:
  - workstation-bootstrap
  - claude-config
  - dotfiles
  - cc-switch-source
  - python-learning
  - typescript-learning
  - rust-learning
  - react-learning
  - sql-learning
  - get-promax-gui

settings:
  git:
    user_name: zgkthu23
    user_email: zgkthu23@gmail.com
  proxy:
    http_proxy: http://127.0.0.1:10808
    https_proxy: http://127.0.0.1:10808
    no_proxy: localhost,127.0.0.1,*.local
  dotfiles:
    manager: chezmoi
    repository: dotfiles
    source: ~/workspace/repos/personal/dotfiles
    apply: preview-and-confirm

secrets:
  github-cli-token:
    keychain_service: github-cli-gh-token
    environment_variable: GH_TOKEN
  tavily-api-key:
    keychain_service: tavily-api-key
    environment_variable: TAVILY_API_KEY
    consumers: [claude-code, tavily-mcp]
