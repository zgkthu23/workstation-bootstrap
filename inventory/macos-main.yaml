# =============================================================================
# 主机清单：macos-main
# macOS 开发笔记本
# =============================================================================

host: macos-main
os: macos
hostname: PUT_YOUR_MACOS_HOSTNAME

# 逻辑根路径
workspace_root: /Users/PUT_YOUR_USERNAME/workspace
data_root: /Users/PUT_YOUR_USERNAME/data
cloud_root: /Users/PUT_YOUR_USERNAME/Library/CloudStorage  # 根据实际云存储目录调整
scratch_root: /Users/PUT_YOUR_USERNAME/scratch

# 启用的功能组
features:
  - common
  - c-development
  - python-development
  - node-development
  - office
  - research
  - optional

# 待克隆的项目组
project_groups:
  - work
  - personal
  - research
  - tools
  - experiments

# Git 身份（模板 — 实际值在 bootstrap 时填入）
git_user_name: "PUT_YOUR_NAME"
git_user_email: "PUT_YOUR_EMAIL"