# =============================================================================
# Inventory: macos-main
# macOS development laptop
# =============================================================================

host: macos-main
os: macos
hostname: PUT_YOUR_MACOS_HOSTNAME

# Logical root paths
workspace_root: /Users/PUT_YOUR_USERNAME/workspace
data_root: /Users/PUT_YOUR_USERNAME/data
cloud_root: /Users/PUT_YOUR_USERNAME/Library/CloudStorage  # adjust to actual cloud provider dir
scratch_root: /Users/PUT_YOUR_USERNAME/scratch

# Enabled feature groups
features:
  - common
  - c-development
  - python-development
  - node-development
  - office
  - research
  - optional

# Project groups to clone
project_groups:
  - work
  - personal
  - research
  - tools
  - experiments

# Git identity (template — real values set during bootstrap)
git_user_name: "PUT_YOUR_NAME"
git_user_email: "PUT_YOUR_EMAIL"

# Optional installations
install_docker: true
install_c_dev: true
install_python_dev: true
install_node_dev: true
install_office: true