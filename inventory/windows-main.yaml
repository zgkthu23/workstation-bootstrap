# =============================================================================
# 主机清单：windows-main
# Windows 11 主力开发桌面
# =============================================================================

host: windows-main
os: windows
hostname: PUT_YOUR_WINDOWS_HOSTNAME_HERE

# 逻辑根路径
workspace_root: C:\Users\zgk23\workspace
data_root: C:\Users\zgk23\data
cloud_root: C:\Users\PUT_YOUR_USERNAME\OneDrive
scratch_root: C:\Users\zgk23\scratch

# 启用的功能组
features:
  - common
  - c-development
  - python-development
  - node-development
  - docker
  - office
  - research
  - optional

# 待克隆的项目组
project_groups:
  - work
  - personal
  - research
  - tools
  - experiments

# Git 身份（模板 — 实际值在 bootstrap 时填入）
git_user_name: "PUT_YOUR_NAME"
git_user_email: "PUT_YOUR_EMAIL"