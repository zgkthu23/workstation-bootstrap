# =============================================================================
# Ubuntu 专属清单
# =============================================================================

features:
  # 网络：GFW 环境下的 VPN 代理，确保外网可达
  networking:
    packages:
      - v2rayn   # VPN 客户端（Clash 内核，GUI）
    env:
      HTTP_PROXY: "http://127.0.0.1:10808"
      HTTPS_PROXY: "http://127.0.0.1:10808"
      NO_PROXY: "localhost,127.0.0.1,*.local"
    description: "GFW 代理 — v2rayN 默认监听 10808 端口"

  c-development:
    packages:
      - gcc
      - g++
      - clang
      - cmake
      - ninja-build
      - gdb
      - valgrind
      - lldb

  python-development:
    packages:
      - python3-dev
      - python3-venv
      - python3-pip
    # astral-sh/uv 不在 apt 源中 — 通过 curl 脚本安装
    manual:
      - name: uv
        url: https://docs.astral.sh/uv/getting-started/installation/
        method: curl

  node-development:
    packages:
      - nodejs
      - npm
    # pnpm 不在 apt 源中
    manual:
      - name: pnpm
        url: https://pnpm.io/installation
        method: curl

  docker:
    packages:
      - docker.io
      - docker-compose-v2

  research:
    packages:
      - texlive-full
      - pandoc
      - zotero-standalone
      - r-base
      - julia
    manual:
      - name: Zotero
        url: https://www.zotero.org/download/

  optional:
    packages:
      - vlc
      - gimp
      - inkscape
      - thunderbird
      - libreoffice
