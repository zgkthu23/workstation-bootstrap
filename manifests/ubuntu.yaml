# =============================================================================
# Ubuntu 专属清单
# =============================================================================

features:
  c-development:
    packages:
      - gcc
      - g++
      - clang
      - cmake
      - ninja-build
      - gdb
      - valgrind
      - lldb

  python-development:
    packages:
      - python3-dev
      - python3-venv
      - python3-pip
    # astral-sh/uv 不在 apt 源中 — 通过 curl 脚本安装
    manual:
      - name: uv
        url: https://docs.astral.sh/uv/getting-started/installation/
        method: curl

  node-development:
    packages:
      - nodejs
      - npm
    # pnpm 不在 apt 源中
    manual:
      - name: pnpm
        url: https://pnpm.io/installation
        method: curl

  docker:
    packages:
      - docker.io
      - docker-compose-v2

  research:
    packages:
      - texlive-full
      - pandoc
      - zotero-standalone
      - r-base
      - julia
    manual:
      - name: Zotero
        url: https://www.zotero.org/download/

  optional:
    packages:
      - vlc
      - gimp
      - inkscape
      - thunderbird
      - libreoffice
