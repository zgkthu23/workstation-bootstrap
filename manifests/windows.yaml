# =============================================================================
# Windows 专属清单
# =============================================================================

features:
  # 网络：GFW 环境下的 VPN 代理，确保外网可达
  networking:
    packages:
      - v2rayN.v2rayN    # VPN 客户端（Clash 内核，GUI）
    env:
      HTTP_PROXY: "http://127.0.0.1:10808"
      HTTPS_PROXY: "http://127.0.0.1:10808"
      NO_PROXY: "localhost,127.0.0.1"
    description: "GFW 代理 — v2rayN 默认监听 10808 端口"

  c-development:
    packages:
      - Microsoft.VisualStudio.2022.Community
      - LLVM.LLVM
      - CMake.CMake
      - Ninja-build.Ninja

  python-development:
    packages:
      - Python.Python.3.12
      - astral-sh.uv

  node-development:
    packages:
      - OpenJS.NodeJS.LTS
      - pnpm.pnpm

  docker:
    packages:
      - Docker.DockerDesktop

  office:
    packages:
      - Microsoft.Office
      - TheDocumentFoundation.LibreOffice
      - Adobe.Acrobat.Reader.64-bit

  research:
    packages:
      - MiKTeX.MiKTeX
      - Zotero.Zotero
      - draw.io

  optional:
    packages:
      - VideoLAN.VLC
      - Spotify.Spotify
      - Notion.Notion
      - Discord.Discord
      - Valve.Steam
      - SlackTechnologies.Slack
