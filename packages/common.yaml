# =============================================================================
# 通用清单 — 每台机器都需要的软件包
# =============================================================================

common:
  description: "所有开发机器必需的核心工具"
  packages:
    windows:
      - Git.Git
      - Microsoft.VisualStudioCode
      - Microsoft.WindowsTerminal
      - Microsoft.PowerShell
      - 7zip.7zip
      - Neovim.Neovim
      - OpenJS.NodeJS.LTS
      - Python.Python.3.12
      - Cyanfish.NAPS2  # 文档扫描仪
      - Eugeny.Tabby  # 终端
    ubuntu:
      - git
      - curl
      - wget
      - build-essential
      - cmake
      - neovim
      - tmux
      - htop
      - ripgrep
      - fd-find
      - jq
      - unzip
      - python3
      - python3-pip
      - python3-venv
      - nodejs
      - npm
      - code          # VS Code（通过 Microsoft apt 源安装）
    macos:
      - git
      - curl
      - wget
      - cmake
      - neovim
      - tmux
      - htop
      - ripgrep
      - fd
      - jq
      - node
      - python@3.12
      - iterm2
      - visual-studio-code
      - claude-code     # Claude Code（官方推荐 native cask）
      - codex           # OpenAI Codex CLI（通过 brew cask 安装）
