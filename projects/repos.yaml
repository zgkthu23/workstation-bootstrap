# =============================================================================
# Git 项目清单
# =============================================================================
#
# 每个项目克隆到: WORKSPACE_ROOT/repos/<group>/<directory>
#
# 字段说明：
#   name:        项目名称
#   url:         Git 克隆地址（HTTPS 或 SSH）
#   group:       项目分类
#   directory:   group/ 下的目标目录名
#   hosts:       需要克隆到的主机列表
#   optional:    设为 true 时，克隆失败不会导致引导流程中断
#   description: 一行简介
# =============================================================================

projects:
  # ── 个人 ───────────────────────────────────────────────────────────
  - name: workstation-bootstrap
    url: git@github.com:zgkthu23/workstation-bootstrap.git
    group: personal
    directory: workstation-bootstrap
    hosts: [windows-main, ubuntu-main, macos-main]
    optional: false
    description: "个人工作站基础设施即代码"

  - name: claude-config
    url: git@github.com:zgkthu23/claude-config.git
    group: personal
    directory: claude-config
    hosts: [windows-main, ubuntu-main, macos-main]
    optional: false
    description: "Claude Code 配置"

  - name: dotfiles
    url: PUT_YOUR_DOTFILES_REPO_URL
    group: personal
    directory: dotfiles
    hosts: [windows-main, ubuntu-main, macos-main]
    optional: true
    description: "个人 dotfiles（chezmoi 源）"

  # ── 工具 ──────────────────────────────────────────────────────────────
  - name: mygit
    url: git@github.com:zgkthu23/mygit.git
    group: tools
    directory: mygit
    hosts: [windows-main, ubuntu-main]
    optional: true
    description: "Python 实现的 git 内部原理"

  - name: ZipCracker
    url: git@github.com:zgkthu23/ZipCracker.git
    group: tools
    directory: ZipCracker
    hosts: [windows-main, ubuntu-main]
    optional: true
    description: "CTF 用 Zip 密码破解工具"

  # ── 工作 ───────────────────────────────────────────────────────────────
  - name: work-project-alpha
    url: PUT_YOUR_WORK_REPO_URL
    group: work
    directory: project-alpha
    hosts: [windows-main, ubuntu-main]
    optional: true
    description: "主要工作项目 — 替换为真实 URL"

  # ── 研究 ───────────────────────────────────────────────────────────
  - name: research-lwfa
    url: PUT_YOUR_LWFA_REPO_URL
    group: research
    directory: lwfa
    hosts: [windows-main, ubuntu-main]
    optional: true
    description: "LWFA 研究项目 — 替换为真实 URL"

  # ── 实验 ────────────────────────────────────────────────────────
  - name: experiments-misc
    url: PUT_YOUR_EXPERIMENTS_REPO_URL
    group: experiments
    directory: misc
    hosts: [windows-main]
    optional: true
    description: "杂项实验 — 替换为真实 URL"