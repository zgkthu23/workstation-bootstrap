normalizations:
  - Repeated Node, Python, CMake, Claude Code, and Codex declarations became one logical tool each.
  - Ubuntu build-essential already supplies gcc and g++, so those package-level duplicates are represented by c-toolchain.
  - macOS llvm is represented by c-toolchain; the separate llvm requirement resolves as explicitly included.
  - Ubuntu Zotero's duplicate apt/manual declarations became one official manual mapping.
  - Windows draw.io was corrected to the current winget ID JGraph.Draw.
